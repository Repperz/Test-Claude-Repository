<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d1e">
<title>Get Ben to the Beers</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0d1e; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Setup: low-res canvas scaled up for chunky pixels
// ---------------------------------------------------------------------------
const W = 180, H = 320, GROUND = 262;
const GAME_LEN = 75;          // seconds of real time from 9:30pm to last orders
const GRAV = 950, JUMP = 330;

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// The world is drawn to an offscreen buffer so we can wobble / double it when drunk
const world = document.createElement('canvas');
world.width = W; world.height = H;
const wx = world.getContext('2d');
wx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit);
fit();

const rnd = (a, b) => a + Math.random() * (b - a);
function hash(i, k) { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------------------------------------------------------------------------
// Tiny 3x5 pixel font
// ---------------------------------------------------------------------------
const GLYPHS = {
  A:[2,5,7,5,5], B:[6,5,6,5,6], C:[3,4,4,4,3], D:[6,5,5,5,6], E:[7,4,6,4,7],
  F:[7,4,6,4,4], G:[3,4,5,5,3], H:[5,5,7,5,5], I:[7,2,2,2,7], J:[1,1,1,5,2],
  K:[5,5,6,5,5], L:[4,4,4,4,7], M:[5,7,7,5,5], N:[6,5,5,5,5], O:[2,5,5,5,2],
  P:[6,5,6,4,4], Q:[2,5,5,6,3], R:[6,5,6,5,5], S:[3,4,2,1,6], T:[7,2,2,2,2],
  U:[5,5,5,5,7], V:[5,5,5,5,2], W:[5,5,7,7,5], X:[5,5,2,5,5], Y:[5,5,2,2,2],
  Z:[7,1,2,4,7],
  '0':[7,5,5,5,7], '1':[2,6,2,2,7], '2':[6,1,2,4,7], '3':[6,1,2,1,6], '4':[5,5,7,1,1],
  '5':[7,4,6,1,6], '6':[3,4,7,5,7], '7':[7,1,2,2,2], '8':[7,5,7,5,7], '9':[7,5,7,1,6],
  '!':[2,2,2,0,2], '?':[6,1,2,0,2], '.':[0,0,0,0,2], ',':[0,0,0,2,4], ':':[0,2,0,2,0],
  "'":[2,2,0,0,0], '-':[0,0,7,0,0], '/':[1,1,2,4,4], '(':[1,2,2,2,1], ')':[4,2,2,2,4],
  '+':[0,2,7,2,0], '*':[5,2,7,2,5], '&':[2,5,2,5,3], ' ':[0,0,0,0,0],
};
const textW = (s, sc = 1) => (String(s).length * 4 - 1) * sc;

function drawText(g, s, x, y, col, sc = 1, align = 'left', shadow = null) {
  s = String(s).toUpperCase();
  if (align === 'center') x = Math.round(x - textW(s, sc) / 2);
  else if (align === 'right') x = Math.round(x - textW(s, sc));
  if (shadow) drawText(g, s, x + sc, y + sc, shadow, sc);
  g.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const gl = GLYPHS[s[i]];
    if (!gl) continue;
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 3; c++)
        if (gl[r] & (4 >> c)) g.fillRect(x + (i * 4 + c) * sc, y + r * sc, sc, sc);
  }
}

// ---------------------------------------------------------------------------
// Sprites (character maps -> offscreen canvases)
// ---------------------------------------------------------------------------
function makeSprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const p = pal[row[x]];
      if (p) { g.fillStyle = p; g.fillRect(x, y, 1, 1); }
    }
  });
  return c;
}

// Ben: spiky brown hair, round wire glasses, stubble, big grin, blue-grey shirt
const BEN_PAL = {
  h: '#6b3e22', H: '#b07a45', s: '#f2b48e', S: '#d38c6a', g: '#3e3636',
  w: '#d6e8f2', e: '#2c3e57', b: '#c99673', m: '#7a2328', t: '#ffffff',
  c: '#8ea7c0', C: '#6f88a3', o: '#e8eef5', p: '#565a3f', k: '#2a2222',
};
const BEN_HEAD = [
  '..H.H..H.H....',
  '.hHhHhhHhHhH..',
  'hhhhhhhhhhhhh.',
  'hhhhhhhhhhhhhh',
  '.hssssssssshh.',
  '.ssggssssggssS',
  '.sgweggggwegsS',
  '.ssggssssggssS',
  '.ssssssSssssS.',
  '.bbssssssssbb.',
  '.bbmttttttmbb.',
  '..bbbmmmmbbb..',
  '...bbbbbbbb...',
  '.....ssss.....',
];
// INEOS Christmas jumper from the work secret santa: a size too small for lanky Ben,
// so his wrists and belly poke out. Knitted benzene ring on the chest. Merry Chemistmas.
Object.assign(BEN_PAL, { J: '#c8232c', j: '#9a1a22', v: '#f4f4f4', G: '#2f8a3e' });
const BEN_NECK = ['.....ssss.....'];
const BEN_JUMPER = [
  '..JJJJJJJJJJ..',
  '.JvGvGvGvGvGJ.',
  '.JJJJJvvJJJJJ.',
  '.JJJJvJJvJJJJ.',
  '.JJJJJvvJJJJJ.',
  '.JJJJJJJJJJJJ.',
  '.JvGvGvGvGvGJ.',
  '.sjjjjjjjjjjs.',
];
const BEN_BELLY = ['...sssSssss...'];
const BEN_LEGS = [
  ['...pppppppp...', '...ppp..ppp...', '..ppp....ppp..', '..pp......pp..',
   '.pp........pp.', '.pp........pp.', '.pp........pp.', 'kkk........kkk'],
  ['...pppppppp...', '....ppp.pp....', '....pp..pp....', '....pp..pp....',
   '....pp..pp....', '....pp..pp....', '....pp..pp....', '...kkk..kkk...'],
];
const BEN_LEGS_JUMP = ['...pppppppp...', '..ppp....ppp..', '.pp........pp.', '.pp........pp.',
  'kk..........kk', '..............', '..............', '..............'];
const BEN_BODY = [...BEN_HEAD, ...BEN_NECK, ...BEN_JUMPER, ...BEN_BELLY];
const BEN_H = BEN_BODY.length + 8;
const JUMPER_TOP = BEN_HEAD.length + BEN_NECK.length;   // row where the jumper starts

const benFrames = BEN_LEGS.map(legs => makeSprite([...BEN_BODY, ...legs], BEN_PAL));
const benJump = makeSprite([...BEN_BODY, ...BEN_LEGS_JUMP], BEN_PAL);
const benHead = makeSprite(BEN_HEAD, BEN_PAL);

// Big Ben for title / end screens, with INEOS knitted across the chest
function drawBigBen(g, x, y, sc) {
  g.drawImage(benFrames[1], x, y, 14 * sc, BEN_H * sc);
  g.fillStyle = BEN_PAL.J;
  g.fillRect(x + 2 * sc, y + (JUMPER_TOP + 2) * sc, 10 * sc, 4 * sc);
  drawText(g, 'INEOS', x + 7 * sc, y + (JUMPER_TOP + 2) * sc + Math.round((4 * sc - 5) / 2), '#ffffff', 1, 'center');
}

const pintSpr = makeSprite([
  '.wwwww...',
  'wwwwwww..',
  'GaaaaaGG.',
  'GaAaaaG.G',
  'GaAaaaG.G',
  'GaAaaaG.G',
  'GaaaaaGG.',
  'GaaaaaG..',
  '.GGGGG...',
], { w: '#fffbe8', G: '#cfe8f0', a: '#e8961e', A: '#ffd26a' });

const kebabSpr = makeSprite([
  '..llrll...',
  '.lmmmmml..',
  'ymmrmmmmy.',
  'yymmmmmyy.',
  '.yyyyyyy..',
  '..yyyyy...',
], { y: '#e8c27a', m: '#8a4a24', l: '#5fbf4a', r: '#e04040' });

const HEART = ['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'];
const heartFull = makeSprite(HEART, { r: '#ff4d6d' });
const heartEmpty = makeSprite(HEART, { r: '#4a3a50' });

// ---------------------------------------------------------------------------
// Audio: tiny WebAudio bleeps, started on first tap
// ---------------------------------------------------------------------------
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  jump:  () => tone(300, 0.15, 'square', 0.05, 620),
  pint:  () => { tone(660, 0.08, 'square', 0.06); tone(990, 0.12, 'square', 0.06, null, 0.08); },
  kebab: () => { tone(220, 0.1, 'triangle', 0.15); tone(330, 0.15, 'triangle', 0.15, null, 0.1); },
  hit:   () => tone(220, 0.35, 'sawtooth', 0.09, 55),
  hic:   () => tone(480, 0.09, 'sine', 0.12, 950),
  text:  () => { tone(1250, 0.05, 'square', 0.04); tone(1550, 0.06, 'square', 0.04, null, 0.07); },
  whoops:() => tone(400, 0.25, 'triangle', 0.1, 150),
  bell:  () => { for (let i = 0; i < 3; i++) { tone(1320, 0.7, 'sine', 0.12, null, i * 0.35); tone(1980, 0.4, 'sine', 0.04, null, i * 0.35); } },
};

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const QUEUE_LINES = ['OI! NO PUSHING IN!', 'BACK OF THE QUEUE!', 'WE WERE HERE FIRST!'];
const SHOPS = [
  ['KEBABS', '#c0262d', '#ffd84a'], ['OFFIE', '#2a6b3a', '#ffffff'], ['BOOKIES', '#14457a', '#ffffff'],
  ['CHIPPY', '#1d6fa3', '#ffe14a'], ['VAPES', '#5b2a86', '#7ff0ff'], ['NAILS', '#e05a9a', '#ffffff'],
  ['PHONES', '#222228', '#44aaff'], ['BARBER', '#a33333', '#ffffff'], ['CHARITY', '#3a7a7a', '#ffffff'],
  ['TANNING', '#e08a2a', '#331111'],
];
const BRICKS = ['#4a2f3a', '#3b3550', '#523a2e', '#2f3d4a', '#4b4038'];
const STARS = Array.from({ length: 40 }, () => ({ x: Math.random() * W * 2, y: Math.random() * 120, b: Math.random() }));

let state = 'title', t = 0, stateT = 0;
let ben, ents, scroll = 0, speed, elapsed, pints, kebabs, dignity, drunk, nextSpawn;
let queueRiot, toast, floaters, shake, pending, jumpBuffer, endReason, pubSpawned, warned, mumIntro, hicCD;
let best = 0;
try { best = +localStorage.getItem('benBeersBest') || 0; } catch (e) {}

function reset() {
  ben = { x: 34, y: GROUND - BEN_H, vy: 0, grounded: true, inv: 0, run: 0 };
  ents = []; speed = 85; elapsed = 0;
  pints = 0; kebabs = 0; dignity = 3; drunk = 0;
  nextSpawn = 160; toast = null; floaters = []; shake = 0;
  pending = []; jumpBuffer = 0; endReason = ''; pubSpawned = false;
  warned = false; mumIntro = false; hicCD = 2; queueRiot = false;
}
reset();

// 0 (sober) .. 1 (absolutely gone)
const drunkFrac = () => Math.min(drunk / 8, 1);

function say(text, col = '#ffffff', dur = 1.8) { toast = { text, col, life: dur }; }
function floatText(text, x, y, col) { floaters.push({ text, x, y, col, life: 1 }); }

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
function press(px, py) {
  audio();
  if (py < 14 && px > W - 18) { muted = !muted; return; }
  if (state === 'title') { reset(); state = 'play'; stateT = 0; return; }
  if (state === 'over') { if (stateT > 1) { reset(); state = 'play'; stateT = 0; } return; }
  if (state === 'play' || state === 'ending') {
    const d = drunkFrac();
    // Very drunk Ben sometimes just... doesn't
    if (d > 0.6 && Math.random() < (d - 0.6) * 0.25) {
      sfx.whoops(); floatText('WHOOPS', ben.x + 7, ben.y - 6, '#ff9ad5'); return;
    }
    // Drunk input lag: up to ~0.22s
    pending.push(d * rnd(0.12, 0.22));
  }
}
document.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  press((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); press(0, H); }
  if (e.code === 'KeyM') muted = !muted;
});

// ---------------------------------------------------------------------------
// Spawning
// ---------------------------------------------------------------------------
const pint = (x, y) => ({ type: 'pint', x, y, w: 9, h: 9, ph: Math.random() * 6 });
const kebab = (x, y) => ({ type: 'kebab', x, y, w: 10, h: 6, ph: Math.random() * 6 });

function spawn() {
  const x = W + 10;
  const r = Math.random();
  let gap;
  if (r < 0.25) {
    ents.push({ type: 'bouncer', x, y: GROUND - 31, w: 14, h: 31 });
    if (Math.random() < 0.6) ents.push(pint(x + 3, GROUND - 64));
    gap = 100;
  } else if (r < 0.48) {
    const n = Math.random() < 0.5 ? 2 : 3;
    const people = Array.from({ length: n }, () => ({
      h: Math.floor(rnd(18, 23)),
      hair: ['#2a1a10', '#d8b04a', '#8a3a1a', '#111', '#bbb'][Math.floor(Math.random() * 5)],
      shirt: ['#d04848', '#3a8a5a', '#e0a030', '#5050c0', '#eee', '#c050a0'][Math.floor(Math.random() * 6)],
      phone: Math.random() < 0.5,
    }));
    ents.push({ type: 'queue', x, y: GROUND - 22, w: n * 10 - 1, h: 22, people });
    if (Math.random() < 0.5) ents.push(pint(x + n * 5 - 4, GROUND - 60));
    gap = 110;
  } else if (r < 0.66 && elapsed > 6) {
    const helen = Math.random() < 0.5;
    ents.push({ type: helen ? 'helen' : 'mum', x, y: GROUND - 48, w: helen ? 38 : 30, h: 12, mult: 1.6, ph: Math.random() * 6 });
    sfx.text();
    if (!mumIntro) { mumIntro = true; say("DON'T JUMP INTO THE TEXTS!", '#7dffa0', 2.5); }
    gap = 120;
  } else if (r < 0.76) {
    ents.push(kebab(x, Math.random() < 0.7 ? GROUND - 9 : GROUND - 48));
    gap = 50;
  } else {
    const n = 2 + Math.floor(Math.random() * 3);
    const high = Math.random() < 0.45;
    for (let i = 0; i < n; i++) {
      const arc = n > 1 ? Math.sin(i / (n - 1) * Math.PI) : 1;
      ents.push(pint(x + i * 14, high ? GROUND - 46 - arc * 14 : GROUND - 12));
    }
    gap = n * 14 + 30;
  }
  nextSpawn = gap + Math.max(30, 90 - elapsed) + Math.random() * 70;
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function doJump(power = 1) {
  const d = drunkFrac();
  ben.vy = -JUMP * power * (1 + (Math.random() - 0.5) * 0.3 * d);
  ben.grounded = false;
  sfx.jump();
}

function hurt(line, col) {
  if (ben.inv > 0) return;
  dignity--;
  ben.inv = 1.3; shake = 6;
  sfx.hit();
  say(line, col);
  if (dignity <= 0) { queueRiot = true; finish('thrown'); }
}

function finish(reason) {
  endReason = reason;
  state = 'over'; stateT = 0;
  if (pints > best) { best = pints; try { localStorage.setItem('benBeersBest', best); } catch (e) {} }
}

function update(dt) {
  if (toast && (toast.life -= dt) <= 0) toast = null;
  for (const f of floaters) { f.life -= dt; f.y -= 18 * dt; }
  floaters = floaters.filter(f => f.life > 0);
  shake = Math.max(0, shake - 20 * dt);

  if (state === 'title') { scroll += 30 * dt; return; }
  if (state === 'over') return;

  elapsed += dt;
  speed = 85 + Math.min(elapsed, GAME_LEN) * 0.7;
  scroll += speed * dt;
  const d = drunkFrac();

  // Delayed (drunk) jump presses -> short jump buffer
  pending = pending.map(p => p - dt);
  if (pending.some(p => p <= 0)) jumpBuffer = 0.12;
  pending = pending.filter(p => p > 0);
  if (jumpBuffer > 0) {
    jumpBuffer -= dt;
    if (ben.grounded) { doJump(); jumpBuffer = 0; }
  }

  // Hiccups: involuntary little hops once properly drunk
  hicCD -= dt;
  if (d > 0.5 && hicCD <= 0 && ben.grounded) {
    hicCD = rnd(1, 3);
    if (Math.random() < (d - 0.5) * 0.8) {
      doJump(0.55); sfx.hic();
      floatText('*HIC*', ben.x + 7, ben.y - 6, '#ffe38a');
    }
  }

  // Physics
  ben.vy += GRAV * dt;
  ben.y += ben.vy * dt;
  if (ben.y >= GROUND - BEN_H) { ben.y = GROUND - BEN_H; ben.vy = 0; ben.grounded = true; }
  ben.run += speed * dt;
  ben.inv = Math.max(0, ben.inv - dt);

  // Spawning
  if (state === 'play') {
    nextSpawn -= speed * dt;
    if (nextSpawn <= 0) spawn();
    if (!warned && elapsed > GAME_LEN - 15) { warned = true; say('LAST ORDERS SOON!', '#ffd84a'); }
    if (elapsed >= GAME_LEN) {
      state = 'ending';
      sfx.bell();
      say('DING DING! LAST ORDERS!', '#ffd84a', 2.5);
    }
  }
  if (state === 'ending' && !pubSpawned) {
    pubSpawned = true;
    const maxX = ents.reduce((m, e) => Math.max(m, e.x + e.w), 0);
    ents.push({ type: 'pub', x: Math.max(W + 10, maxX + 70), y: GROUND - 130, w: 100, h: 130 });
  }

  // Entities
  const sway = Math.sin(t * 3) * 2 * d;
  const box = { x: ben.x + 3 + sway, y: ben.y + 3, w: 8, h: BEN_H - 4 };
  for (const e of ents) {
    e.x -= speed * (e.mult || 1) * dt;
    if (e.dead) continue;
    if (e.type === 'pub') {
      if (e.x + 48 <= ben.x + 7) { e.dead = true; finish('pub'); }
      continue;
    }
    const hb = (e.type === 'pint' || e.type === 'kebab')
      ? { x: e.x - 2, y: e.y - 2, w: e.w + 4, h: e.h + 4 }
      : { x: e.x + 2, y: e.y + 2, w: e.w - 4, h: e.h - 3 };
    if (!overlap(box, hb)) continue;
    if (e.type === 'pint') {
      e.dead = true; pints++; drunk += 0.6; sfx.pint();
      floatText('+1 PINT', e.x + 4, e.y - 4, '#ffd26a');
    } else if (e.type === 'kebab') {
      e.dead = true; kebabs++; drunk = Math.max(0, drunk - 1.5); sfx.kebab();
      floatText('KEBAB! SOBERING...', e.x + 5, e.y - 4, '#9cff7a');
    } else if (e.type === 'bouncer') {
      sfx.hit(); shake = 6; finish('thrown');
    } else if (e.type === 'queue') {
      hurt(QUEUE_LINES[Math.floor(Math.random() * QUEUE_LINES.length)], '#ffb36a');
    } else if (e.type === 'mum' || e.type === 'helen') {
      sfx.hit(); shake = 6; finish(e.type);
    }
    if (state === 'over') break;
  }
  ents = ents.filter(e => e.x + e.w > -40 && !(e.dead && e.type !== 'pub'));
}

// ---------------------------------------------------------------------------
// Drawing: world
// ---------------------------------------------------------------------------
function layer(g, par, tile, drawTile) {
  const off = scroll * par;
  const i0 = Math.floor(off / tile);
  for (let i = i0 - 1; i <= i0 + Math.ceil(W / tile) + 1; i++) drawTile(g, Math.round(i * tile - off), i);
}

function drawSky(g) {
  const bands = ['#0b0d1e', '#110f2a', '#171335', '#1e1740', '#271c4a', '#331f50'];
  const bh = Math.ceil(GROUND / bands.length);
  bands.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * bh, W, bh); });
  for (const s of STARS) {
    const x = Math.round(((s.x - scroll * 0.03) % (W * 2) + W * 2) % (W * 2));
    if (x > W) continue;
    g.fillStyle = (Math.sin(t * 2 + s.b * 10) > 0.6) ? '#ffffff' : '#8f8fbf';
    g.fillRect(x, Math.round(s.y), 1, 1);
  }
  // moon
  g.fillStyle = '#f4f0d0'; g.fillRect(138, 36, 12, 12); g.fillRect(136, 38, 16, 8); g.fillRect(140, 34, 8, 16);
  g.fillStyle = '#d8d2a8'; g.fillRect(141, 39, 3, 3); g.fillRect(146, 44, 2, 2);
}

function drawRooftops(g) {
  layer(g, 0.15, 22, (g, x, i) => {
    const h = 40 + Math.floor(hash(i, 1) * 45);
    const top = GROUND - 80 - h;
    g.fillStyle = '#1a1838'; g.fillRect(x, top, 22, h + 80);
    if (hash(i, 2) > 0.5) g.fillRect(x + 4, top - 6, 4, 6);
    for (let wy = top + 6; wy < GROUND - 90; wy += 10)
      for (let wxp = x + 3; wxp < x + 19; wxp += 7)
        if (hash(i * 13 + wy, wxp) > 0.72) { g.fillStyle = '#b89a4a'; g.fillRect(wxp, wy, 3, 4); g.fillStyle = '#1a1838'; }
  });
}

// Flag hung in an upstairs window
function drawUnionJack(g, x, y) {
  g.fillStyle = '#20202a'; g.fillRect(x, y - 1, 12, 1);
  g.fillStyle = '#1f3a8a'; g.fillRect(x, y, 12, 8);
  g.fillStyle = '#ffffff';
  for (let c = 0; c < 12; c++) { const r = Math.round(c * 7 / 11); g.fillRect(x + c, y + r, 1, 1); g.fillRect(x + c, y + 7 - r, 1, 1); }
  g.fillRect(x, y + 2, 12, 4); g.fillRect(x + 4, y, 4, 8);
  g.fillStyle = '#d0202a'; g.fillRect(x, y + 3, 12, 2); g.fillRect(x + 5, y, 2, 8);
}

// Bloke in a vest stood in his window, occasionally raising a can
function drawBloke(g, x, y, seed) {
  const cheers = Math.floor(t * 0.8 + seed) % 3 === 0;
  g.fillStyle = '#e0a888'; g.fillRect(x + 4, y + 3, 4, 5);          // head
  g.fillStyle = '#5a3a2a'; g.fillRect(x + 4, y + 3, 4, 1);          // receding hairline
  g.fillStyle = '#222'; g.fillRect(x + 5, y + 5, 1, 1); g.fillRect(x + 7, y + 5, 1, 1);
  g.fillStyle = '#f0f0f0'; g.fillRect(x + 3, y + 9, 6, 7);          // vest
  g.fillStyle = '#e0a888'; g.fillRect(x + 2, y + 9, 1, 5); g.fillRect(x + 4, y + 8, 4, 1);
  if (cheers) { g.fillRect(x + 9, y + 4, 1, 6); g.fillStyle = '#c03030'; g.fillRect(x + 9, y + 2, 2, 3); }
  else { g.fillRect(x + 9, y + 9, 1, 4); g.fillStyle = '#c03030'; g.fillRect(x + 9, y + 12, 2, 3); }
}

// St Mary's (Southampton) drifting past above the rooftops
function drawStadium(g) {
  const SPAN = 900, SW = 120, off = scroll * 0.2;
  const i0 = Math.floor(off / SPAN);
  for (let i = i0 - 1; i <= i0 + 1; i++) {
    const x = Math.round(i * SPAN + 320 - off);
    if (x > W || x + SW + 10 < 0) continue;
    const top = GROUND - 162;
    // floodlight glow over the pitch
    g.fillStyle = 'rgba(255,250,210,0.10)'; g.fillRect(x + 10, top - 16, SW - 20, 16);
    g.fillStyle = 'rgba(255,250,210,0.06)'; g.fillRect(x + 2, top - 28, SW - 4, 12);
    // roof + stand
    g.fillStyle = '#d8d8e0'; g.fillRect(x + 14, top, SW - 28, 3); g.fillRect(x + 8, top + 3, SW - 16, 3);
    g.fillStyle = '#d71920'; g.fillRect(x + 6, top + 6, SW - 12, 60);
    g.fillStyle = '#ffffff';
    for (let sx = x + 10; sx < x + SW - 8; sx += 8) g.fillRect(sx, top + 6, 3, 14);
    g.fillStyle = '#15151c'; g.fillRect(x + 30, top + 24, SW - 60, 9);
    drawText(g, 'SAINTS', x + SW / 2, top + 26, '#ffffff', 1, 'center');
    g.fillStyle = '#a01218'; g.fillRect(x + 6, top + 36, SW - 12, 2);
    // flag on the roof
    g.fillStyle = '#888'; g.fillRect(x + SW / 2, top - 8, 1, 8);
    g.fillStyle = Math.floor(t * 3) % 2 ? '#d71920' : '#ffffff'; g.fillRect(x + SW / 2 + 1, top - 8, 5, 3);
    // floodlight pylons
    for (const px of [x + 2, x + SW - 4]) {
      g.fillStyle = '#5a5a6e'; g.fillRect(px, top - 22, 2, 90);
      g.fillStyle = '#fffbe0'; g.fillRect(px - 3, top - 26, 8, 4);
      g.fillStyle = 'rgba(255,250,210,0.25)'; g.fillRect(px - 5, top - 28, 12, 8);
    }
  }
}

function drawShops(g) {
  layer(g, 0.6, 64, (g, x, i) => {
    const shop = SHOPS[Math.floor(hash(i, 3) * SHOPS.length)];
    const brick = BRICKS[Math.floor(hash(i, 4) * BRICKS.length)];
    const top = GROUND - 110 - Math.floor(hash(i, 5) * 20);
    // upper floor
    g.fillStyle = brick; g.fillRect(x, top, 64, GROUND - top);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x, top, 64, 2); g.fillRect(x + 63, top, 1, GROUND - top);
    for (let k = 0; k < 2; k++) {
      const lit = hash(i, 6 + k) > 0.45;
      g.fillStyle = '#20202a'; g.fillRect(x + 10 + k * 28, top + 12, 16, 20);
      const wx0 = x + 12 + k * 28, wy0 = top + 14;
      g.fillStyle = lit ? '#e8c46a' : '#2a3048'; g.fillRect(wx0, wy0, 12, 16);
      if (hash(i, 20 + k) < 0.14) drawUnionJack(g, wx0, wy0 + 1);
      else if (lit && hash(i, 30 + k) < 0.22) drawBloke(g, wx0, wy0, i + k);
      else { g.fillStyle = '#20202a'; g.fillRect(wx0 + 5, wy0, 2, 16); }
    }
    // sign
    g.fillStyle = shop[1]; g.fillRect(x + 2, GROUND - 64, 60, 12);
    g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(x + 2, GROUND - 64, 60, 1);
    drawText(g, shop[0], x + 32, GROUND - 61, shop[2], 1, 'center');
    // shop window + door
    g.fillStyle = '#1a1a22'; g.fillRect(x + 2, GROUND - 52, 60, 52);
    g.fillStyle = shop[0] === 'KEBABS' ? '#ffcf7a' : '#c9b37a';
    g.fillRect(x + 5, GROUND - 48, 36, 30);
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + 8, GROUND - 46, 2, 10); g.fillRect(x + 12, GROUND - 46, 1, 6);
    if (shop[0] === 'KEBABS') { // rotating doner
      g.fillStyle = '#8a4a24'; g.fillRect(x + 30, GROUND - 46, 6, 22);
      g.fillStyle = '#a8602e'; g.fillRect(x + 31 + (Math.floor(t * 4) % 3), GROUND - 46, 2, 22);
      g.fillStyle = '#666'; g.fillRect(x + 32, GROUND - 48, 2, 2); g.fillRect(x + 32, GROUND - 24, 2, 4);
    }
    g.fillStyle = '#3a2a22'; g.fillRect(x + 45, GROUND - 46, 14, 46);
    g.fillStyle = '#d0a040'; g.fillRect(x + 56, GROUND - 24, 1, 2);
  });
}

function drawStreet(g) {
  // pavement
  g.fillStyle = '#5a5868'; g.fillRect(0, GROUND, W, 20);
  g.fillStyle = '#4a4858';
  const off = Math.round(scroll % 16);
  for (let x = -off; x < W; x += 16) g.fillRect(x, GROUND, 1, 20);
  g.fillRect(0, GROUND + 10, W, 1);
  // kerb + road
  g.fillStyle = '#8a8898'; g.fillRect(0, GROUND + 20, W, 3);
  g.fillStyle = '#26262f'; g.fillRect(0, GROUND + 23, W, H - GROUND - 23);
  g.fillStyle = '#d8d8d8';
  const doff = Math.round(scroll % 40);
  for (let x = -doff; x < W; x += 40) g.fillRect(x, GROUND + 40, 20, 2);
}

function drawLamps(g) {
  layer(g, 1, 150, (g, x) => {
    x += 90;
    g.fillStyle = 'rgba(255,220,120,0.12)';
    g.fillRect(x - 14, GROUND - 66, 32, 8); g.fillRect(x - 10, GROUND - 58, 24, 4);
    g.fillStyle = 'rgba(255,220,120,0.10)'; g.fillRect(x - 16, GROUND, 36, 10);
    g.fillStyle = '#2a2a33'; g.fillRect(x + 1, GROUND - 70, 2, 70); g.fillRect(x - 3, GROUND - 72, 10, 3);
    g.fillStyle = '#ffe27a'; g.fillRect(x - 1, GROUND - 69, 6, 2);

}

function drawBouncer(g, x, y) {

  g.fillStyle = suit; g.fillRect(x + 3, y + 22, 3, 8); g.fillRect(x + 8, y + 22, 3, 8);
  g.fillStyle = '#000'; g.fillRect(x + 2, y + 30, 4, 1); g.fillRect(x + 8, y + 30, 4, 1);

  g.fillStyle = skin; g.fillRect(x + 1, y + 15, 2, 2); g.fillRect(x + 11, y + 16, 2, 2);
  g.fillRect(x + 5, y + 8, 4, 2); g.fillRect(x + 4, y + 1, 6, 8); g.fillRect(x + 3, y + 3, 8, 5);

  g.fillStyle = '#000'; g.fillRect(x + 3, y + 4, 8, 2);

}

function drawQueue(g, e) {
  const x0 = Math.round(e.x);
  e.people.forEach((p, i) => {
    const x = x0 + i * 10, top = GROUND - p.h;
    g.fillStyle = '#2a2a3a'; g.fillRect(x + 2, GROUND - 7, 2, 7); g.fillRect(x + 5, GROUND - 7, 2, 7);
    g.fillStyle = p.shirt; g.fillRect(x + 1, top + 7, 7, p.h - 14);
    g.fillStyle = '#e8b090'; g.fillRect(x + 2, top + 1, 5, 6);
    g.fillStyle = p.hair; g.fillRect(x + 2, top, 5, 2); g.fillRect(x + 2, top + 2, 1, 3);
    g.fillStyle = '#222'; g.fillRect(x + 5, top + 3, 1, 1);
    if (p.phone) { g.fillStyle = '#7fd8ff'; g.fillRect(x + 6, top + 9, 2, 3); }
  });
  drawText(g, 'KEBAB QUEUE', x0 + e.w / 2, GROUND - 31, '#ffd84a', 1, 'center', '#000');
}

const TEXT_STYLE = { mum: ['MUM...', '#35c759', '#0a3a14'], helen: ['HELEN...', '#0a84ff', '#06264a'] };
function drawTextMsg(g, e) {
  const [label, fill, edge] = TEXT_STYLE[e.type];
  const x = Math.round(e.x), y = Math.round(e.y + Math.sin(t * 6 + e.ph) * 1.5);
  g.fillStyle = edge; g.fillRect(x, y - 1, e.w, e.h + 2); g.fillRect(x - 1, y, e.w + 2, e.h);
  g.fillStyle = fill; g.fillRect(x, y, e.w, e.h);
  g.fillRect(x - 2, y + e.h - 2, 3, 3);
  drawText(g, label, x + 4, y + 4, '#ffffff');
  g.fillStyle = '#ff3b30'; g.fillRect(x + e.w - 3, y - 3, 5, 5);
  g.fillStyle = '#fff'; g.fillRect(x + e.w - 1, y - 2, 1, 3);
}

function drawPub(g, e) {
  const x = Math.round(e.x), y = e.y;
  g.fillStyle = '#1f4a2e'; g.fillRect(x, y + 30, e.w, e.h - 30);
  g.fillStyle = '#3d2a20'; g.fillRect(x - 2, y + 18, e.w + 4, 14);
  g.fillStyle = '#d8b04a'; g.fillRect(x - 2, y + 18, e.w + 4, 1); g.fillRect(x - 2, y + 31, e.w + 4, 1);
  drawText(g, 'THE RED LION', x + e.w / 2, y + 22, '#ffd84a', 1, 'center');
  g.fillStyle = '#4a2a20'; g.fillRect(x - 4, y + 10, e.w + 8, 8);
  // windows with warm light and silhouettes
  for (const wx0 of [x + 6, x + 62]) {
    g.fillStyle = '#d8b04a'; g.fillRect(wx0 - 1, y + 49, 32, 40);
    g.fillStyle = '#ffcc66'; g.fillRect(wx0, y + 50, 30, 38);
    g.fillStyle = '#7a4a20'; g.fillRect(wx0 + 4, y + 70, 6, 18); g.fillRect(wx0 + 18, y + 72, 6, 16);
    g.fillRect(wx0 + 5, y + 64, 4, 5); g.fillRect(wx0 + 19, y + 66, 4, 5);
    g.fillStyle = '#d8b04a'; g.fillRect(wx0 + 14, y + 50, 2, 38);
  }
  // open door
  g.fillStyle = '#d8b04a'; g.fillRect(x + 39, y + 59, 20, 71);
  g.fillStyle = '#ffe9a0'; g.fillRect(x + 41, y + 61, 16, 69);
  // hanging sign
  g.fillStyle = '#2a2a33'; g.fillRect(x + e.w - 2, y + 40, 12, 2);
  g.fillStyle = '#a02020'; g.fillRect(x + e.w + 2, y + 42, 10, 12);
  g.fillStyle = '#ffd84a'; g.fillRect(x + e.w + 5, y + 45, 4, 6);
  drawText(g, 'LAST ORDERS', x + e.w / 2, y + 40, Math.floor(t * 4) % 2 ? '#ffffff' : '#ffd84a', 1, 'center');
}

function drawBen(g) {
  if (ben.inv > 0 && Math.floor(t * 16) % 2) return;
  const d = drunkFrac();
  const sway = Math.sin(t * 3) * 2 * d;
  const x = Math.round(ben.x + sway), y = Math.round(ben.y);
  // shadow
  const lift = Math.min(1, (GROUND - BEN_H - ben.y) / 60);
  g.fillStyle = 'rgba(0,0,0,0.35)';
  const sw = Math.round(12 - lift * 6);
  g.fillRect(x + 7 - sw / 2, GROUND - 1, sw, 2);
  const spr = ben.grounded ? benFrames[Math.floor(ben.run / 10) % 2] : benJump;
  g.drawImage(spr, x, y);
  if (drunk >= 2) { // rosy cheeks
    g.fillStyle = '#e8606a';
    g.fillRect(x + 2, y + 8, 2, 1); g.fillRect(x + 10, y + 8, 2, 1);
  }
}

function drawWorld(g) {
  drawSky(g);
  drawRooftops(g);
  drawStadium(g);
  drawShops(g);
  drawStreet(g);
  drawLamps(g);
  if (state !== 'title') {
    for (const e of ents) if (e.type === 'pub') drawPub(g, e);
    for (const e of ents) {
      const x = Math.round(e.x);
      if (e.type === 'bouncer') drawBouncer(g, x, Math.round(e.y));
      else if (e.type === 'queue') drawQueue(g, e);
      else if (e.type === 'mum' || e.type === 'helen') drawTextMsg(g, e);
      else if (e.type === 'pint') {
        const y = Math.round(e.y + Math.sin(t * 4 + e.ph) * 1.5);
        g.drawImage(pintSpr, x, y);
        if (Math.floor(t * 3 + e.ph) % 4 === 0) { g.fillStyle = '#fff'; g.fillRect(x + 7, y - 1, 1, 1); }
      } else if (e.type === 'kebab') {
        g.drawImage(kebabSpr, x, Math.round(e.y + Math.sin(t * 4 + e.ph) * 1));
      }
    }
    if (!(state === 'over' && endReason === 'pub')) drawBen(g);
  }
  for (const f of floaters) {
    if (f.life < 0.3 && Math.floor(t * 20) % 2) continue;
    drawText(g, f.text, f.x, Math.round(f.y), f.col, 1, 'center', '#000');
  }
}

// ---------------------------------------------------------------------------
// Drawing: HUD + screens
// ---------------------------------------------------------------------------
function clockText() {
  const mins = 21 * 60 + 30 + Math.min(elapsed / GAME_LEN, 1) * 90;
  const h = Math.floor(mins / 60), m = Math.floor(mins % 60);
  return `${h > 12 ? h - 12 : h}:${String(m).padStart(2, '0')}PM`;
}

function drawMute(g) {
  const x = W - 15, y = 4;
  g.fillStyle = '#ffffff';
  g.fillRect(x, y + 2, 2, 3); g.fillRect(x + 2, y + 1, 1, 5); g.fillRect(x + 3, y, 1, 7);
  if (muted) { g.fillStyle = '#ff4d6d'; for (let i = 0; i < 5; i++) { g.fillRect(x + 5 + i, y + 1 + i, 1, 1); g.fillRect(x + 9 - i, y + 1 + i, 1, 1); } }
  else { g.fillRect(x + 5, y + 2, 1, 3); g.fillRect(x + 7, y + 1, 1, 5); }
}

function drawHUD(g) {
  drawMute(g);
  if (state === 'title') return;
  g.fillStyle = 'rgba(5,5,15,0.6)'; g.fillRect(0, 0, W, 26);
  g.drawImage(pintSpr, 3, 3);
  drawText(g, pints, 14, 5, '#ffd26a');
  g.drawImage(kebabSpr, 30, 5);
  drawText(g, kebabs, 42, 5, '#9cff7a');
  for (let i = 0; i < 3; i++) g.drawImage(i < dignity ? heartFull : heartEmpty, 56 + i * 9, 4);
  const late = elapsed > GAME_LEN - 15;
  drawText(g, clockText(), W - 20, 5, late && Math.floor(t * 4) % 2 ? '#ff4d6d' : '#ffffff', 1, 'right');
  // drunk-o-meter
  drawText(g, 'DRUNK', 3, 16, '#bbbbdd');
  const d = drunkFrac();
  g.fillStyle = '#2a2a3a'; g.fillRect(25, 16, 80, 5);
  const fill = Math.round(78 * d);
  g.fillStyle = d < 0.35 ? '#5fd35f' : d < 0.7 ? '#ffd84a' : '#ff5a5a';
  g.fillRect(26, 17, fill, 3);
  const label = d < 0.15 ? 'SOBER' : d < 0.35 ? 'MERRY' : d < 0.6 ? 'TIPSY' : d < 0.85 ? 'WOBBLY' : 'STEAMING';
  drawText(g, label, 110, 16, '#ffffff');
  // toast
  if (toast) {
    const w = textW(toast.text) + 8;
    g.fillStyle = 'rgba(0,0,0,0.75)'; g.fillRect(Math.round(W / 2 - w / 2), 32, w, 11);
    drawText(g, toast.text, W / 2, 35, toast.col, 1, 'center');
  }
  if (state === 'play' && elapsed < 3.5 && Math.floor(t * 3) % 2)
    drawText(g, 'TAP TO JUMP!', W / 2, 120, '#ffffff', 2, 'center', '#000');
}

function rating() {
  if (endReason === 'mum') return 'GROUNDED';
  if (endReason === 'helen') return 'SLEEPING ON THE SOFA';
  if (endReason === 'thrown') return pints >= 6 ? 'BARRED (WORTH IT)' : 'BARRED';
  if (pints === 0) return 'DESIGNATED DRIVER';
  if (pints <= 2) return 'LIGHTWEIGHT';
  if (pints <= 5) return 'NICELY MERRY';
  if (pints <= 8) return 'PROPER WOBBLY';
  if (pints <= 12) return 'ABSOLUTE LEGEND';
  return 'HIGH STREET ROYALTY';
}

function bubble(g, x, y, lines, fill, ink, tailX) {
  const w = Math.max(...lines.map(l => textW(l))) + 8, h = lines.length * 8 + 4;
  g.fillStyle = fill;
  g.fillRect(x, y, w, h); g.fillRect(x - 1, y + 1, w + 2, h - 2);
  if (tailX != null) { g.fillRect(tailX, y + h, 4, 2); g.fillRect(tailX + 1, y + h + 2, 2, 2); }
  lines.forEach((l, i) => drawText(g, l, x + 4, y + 3 + i * 8, ink));
}

function drawTitle(g) {
  g.fillStyle = 'rgba(5,5,20,0.72)'; g.fillRect(0, 0, W, H);
  const bob = Math.round(Math.sin(t * 3) * 2);
  drawBigBen(g, 46, 18 + bob, 2);
  bubble(g, 86, 22, ['MERRY', 'CHEMISTMAS!'], '#ffffff', '#c8232c', 88);
  drawText(g, 'GET BEN', W / 2, 92, '#ffd84a', 3, 'center', '#7a2328');
  drawText(g, 'TO THE BEERS', W / 2, 112, '#ffd84a', 2, 'center', '#7a2328');
  const lines = [
    ['TAP ANYWHERE TO JUMP', '#ffffff'],
    ['GRAB PINTS (+ GET DRUNKER)', '#ffd26a'],
    ['KEBABS SOBER YOU UP', '#9cff7a'],
    ['JUMP BOUNCERS & KEBAB QUEUES', '#ff9a7a'],
    ["DON'T JUMP INTO TEXTS", '#7dffa0'],
    ['FROM MUM OR HELEN!', '#7dc4ff'],
    ['MAKE IT TO LAST ORDERS!', '#ffffff'],
  ];
  lines.forEach(([s, c], i) => drawText(g, s, W / 2, 132 + i * 9, c, 1, 'center', '#000'));
  g.drawImage(pintSpr, 18, 222); g.drawImage(kebabSpr, 34, 225);
  drawBouncer(g, 54, 200);
  drawTextMsg(g, { type: 'mum', x: 76, y: 218, w: 30, h: 12, ph: 0 });
  drawTextMsg(g, { type: 'helen', x: 112, y: 218, w: 38, h: 12, ph: 2 });
  if (Math.floor(t * 2) % 2) drawText(g, 'TAP TO START', W / 2, 250, '#ffffff', 2, 'center', '#000');
  if (best) drawText(g, `BEST: ${best} PINT${best === 1 ? "" : "S"}`, W / 2, 290, '#bbbbdd', 1, 'center');
}

// --- End-screen scenes (each fits in the band y=76..172) ---
const bouncerSpr = document.createElement('canvas');
bouncerSpr.width = 14; bouncerSpr.height = 31;
drawBouncer(bouncerSpr.getContext('2d'), 0, 0);

function sceneBouncer(g) {
  // Little looping "gif": finger wag, sunglasses glint, speech typed out
  const sc = 3, bx = 22, by = 78;
  const sway = Math.floor(t * 2) % 2;
  g.drawImage(bouncerSpr, bx + sway, by, 14 * sc, 31 * sc);
  const wag = Math.floor(t * 6) % 2;
  g.fillStyle = '#15151c'; g.fillRect(bx + 13 * sc + sway, by + 10 * sc, 6, 14);
  g.fillStyle = '#a8714f';
  g.fillRect(bx + 13 * sc + 1 + sway + (wag ? 3 : -2), by + 10 * sc - 9, 6, 9);
  g.fillRect(bx + 13 * sc + 3 + sway + (wag ? 5 : -4), by + 10 * sc - 17, 3, 9);
  if (Math.floor(t * 1.5) % 3 === 0) { g.fillStyle = '#ffffff'; g.fillRect(bx + 4 * sc + sway + Math.floor((t * 30) % 18), by + 4 * sc, 2, 2); }
  const full = ['NOT TODAY,', 'PAL.'];
  let n = Math.floor(((stateT * 12) % 30));
  const shown = full.map(l => { const part = l.slice(0, Math.max(0, n)); n -= l.length; return part; });
  bubble(g, 92, 84, shown.map((l, i) => l.padEnd(full[i].length)), '#ffffff', '#15151c', 92);
  g.drawImage(benHead, 118, 132, 28, 28);
}

function sceneMum(g) {
  bubble(g, 40, 80, ["MUM: I'M OUTSIDE", 'IN THE CAR X'], '#35c759', '#ffffff', 100);
  const x = 50, y = 116, bounce = Math.floor(t * 4) % 2;
  g.fillStyle = '#7a8a9a'; g.fillRect(x + 12, y + bounce, 44, 14); g.fillRect(x, y + 12 + bounce, 80, 18);
  g.fillStyle = '#cfe8f5'; g.fillRect(x + 16, y + 3 + bounce, 16, 10); g.fillRect(x + 36, y + 3 + bounce, 16, 10);
  g.drawImage(benHead, x + 37, y + 1 + bounce, 14, 14);
  g.fillStyle = '#4a3020'; g.fillRect(x + 19, y + 5 + bounce, 10, 4); // mum's hair
  g.fillStyle = '#ffe27a'; g.fillRect(x + 76, y + 16 + bounce, 4, 4);
  g.fillStyle = '#ff5a5a'; g.fillRect(x, y + 16 + bounce, 3, 4);
  g.fillStyle = '#1a1a22'; g.fillRect(x + 10, y + 26, 14, 14); g.fillRect(x + 56, y + 26, 14, 14);
  g.fillStyle = '#888'; g.fillRect(x + 15, y + 31, 4, 4); g.fillRect(x + 61, y + 31, 4, 4);
  drawText(g, 'SCHOOL RUN', x + 40, y + 19 + bounce, '#ffffff', 1, 'center');
}

function sceneHelen(g) {
  bubble(g, 30, 78, ['HELEN: WE NEED', 'TO TALK.'], '#0a84ff', '#ffffff', 60);
  const x = 56, y = 104;
  g.fillStyle = '#8a2a20';                       // roof
  for (let i = 0; i < 18; i++) g.fillRect(x + 34 - i * 2 - 4, y + i, i * 4 + 8, 1);
  g.fillStyle = '#a0682e'; g.fillRect(x, y + 18, 68, 46);    // walls
  g.fillStyle = '#7a4a1e'; for (let i = 0; i < 4; i++) g.fillRect(x, y + 26 + i * 10, 68, 1);
  g.fillStyle = '#1a1010'; g.fillRect(x + 20, y + 30, 28, 34); g.fillRect(x + 22, y + 27, 24, 3); // door
  g.drawImage(benHead, x + 20, y + 36 + (Math.floor(t * 2) % 2), 28, 28);
  g.fillStyle = '#e8d8b0'; g.fillRect(x + 24, y + 20, 20, 7);
  drawText(g, 'BEN', x + 34, y + 21, '#5a2a10', 1, 'center');
  g.fillStyle = '#c0c0c8'; g.fillRect(x + 72, y + 58, 14, 6); g.fillRect(x + 70, y + 57, 18, 1); // dog bowl
}

function scenePub(g) {
  drawBigBen(g, W / 2 - 14, 78, 2);
  if (drunk >= 2) { g.fillStyle = '#e8606a'; g.fillRect(W / 2 - 10, 94, 4, 2); g.fillRect(W / 2 + 6, 94, 4, 2); }
  g.drawImage(pintSpr, W / 2 + 16, 118 + (Math.floor(t * 3) % 2), 18, 18);
}

const ENDINGS = {
  pub:    ['LAST ORDERS!', '#ffd84a', () => 'BEN MADE IT TO THE PUB', scenePub],
  thrown: ['THROWN OUT!', '#ff5a5a', () => queueRiot ? 'KICKED OFF IN THE KEBAB QUEUE' : 'CAUGHT BY THE BOUNCER', sceneBouncer],
  mum:    ["MUM'S HERE!", '#35c759', () => 'MUM CAME TO PICK YOU UP FROM SCHOOL', sceneMum],
  helen:  ['DOGHOUSE!', '#4aa8ff', () => 'HELEN SAW THE STATE OF YOU', sceneHelen],
};

function drawOver(g) {
  g.fillStyle = 'rgba(5,5,20,0.82)'; g.fillRect(0, 0, W, H);
  const [title, col, sub, scene] = ENDINGS[endReason];
  drawText(g, title, W / 2, 40, col, 2, 'center', '#000');
  drawText(g, sub(), W / 2, 60, '#ffffff', 1, 'center');
  scene(g);
  const s = (n, w) => `${n} ${w}${n === 1 ? '' : 'S'}`;
  drawText(g, s(pints, 'PINT') + ',', W / 2, 184, '#ffd26a', 2, 'center', '#000');
  drawText(g, s(kebabs, 'KEBAB') + ',', W / 2, 200, '#9cff7a', 2, 'center', '#000');
  drawText(g, `${dignity} DIGNITY`, W / 2, 216, dignity ? '#ff9ad5' : '#ff5a5a', 2, 'center', '#000');
  drawText(g, 'VERDICT: ' + rating(), W / 2, 238, '#ffffff', 1, 'center');
  drawText(g, `BEST: ${best} PINT${best === 1 ? "" : "S"}`, W / 2, 252, '#bbbbdd', 1, 'center');
  if (stateT > 1 && Math.floor(t * 2) % 2) drawText(g, 'TAP TO GO AGAIN', W / 2, 274, '#ffffff', 1, 'center', '#000');
}

function render() {
  drawWorld(wx);
  const d = state === 'title' ? 0 : drunkFrac();
  ctx.fillStyle = '#0b0d1e'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.translate(W / 2 + sx, H / 2 + sy);
  ctx.rotate(Math.sin(t * 1.3) * 0.05 * d);
  const z = 1 + 0.08 * d;
  ctx.scale(z, z);
  ctx.translate(-W / 2 + Math.sin(t * 0.9) * 5 * d, -H / 2 + Math.cos(t * 1.1) * 3 * d);
  ctx.drawImage(world, 0, 0);
  if (d > 0.25) { // double vision
    ctx.globalAlpha = 0.15 + 0.25 * (d - 0.25) / 0.75;
    ctx.drawImage(world, Math.round(3 + Math.sin(t * 2) * 4 * d), Math.round(Math.cos(t * 1.7) * 2 * d));
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (d > 0) { ctx.fillStyle = `rgba(255,150,40,${0.08 * d})`; ctx.fillRect(0, 0, W, H); }
  drawHUD(ctx);
  if (state === 'title') drawTitle(ctx);
  if (state === 'over') drawOver(ctx);
}

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now; t += dt; stateT += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
